<svg xmlns="http://www.w3.org/2000/svg" width="980" height="456" viewBox="0 0 980 456"><rect x="0.5" y="0.5" width="979" height="455" rx="14" fill="#ffffff" stroke="#e2e0d8"/><text x="490.0" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#323748" text-anchor="middle"><tspan x="490.0" dy="0.0">What your research document holds, for each kind of article</tspan></text><rect x="20.0" y="64" width="296" height="360" rx="14" fill="#f7f4e2" stroke="#d7d2bb"/><path d="M20.0,78 a14,14 0 0 1 14,-14 h268 a14,14 0 0 1 14,14 v40 h-296 Z" fill="#323748"/><text x="40.0" y="99" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="40.0" dy="0.0">Top 10 artefacts</tspan></text><text x="40.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="40.0" dy="0.0">e.g. &quot;The most valuable stamps ever</tspan><tspan x="40.0" dy="16.9">sold at auction&quot;</tspan></text><circle cx="46.0" cy="183" r="4" fill="#8fd1d5"/><text x="60.0" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60.0" dy="0.0">Background for the introduction</tspan></text><circle cx="46.0" cy="216" r="4" fill="#8fd1d5"/><text x="60.0" y="221" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60.0" dy="0.0">What separates the real thing</tspan><tspan x="60.0" dy="18.9">from copies and merchandise</tspan></text><circle cx="46.0" cy="268" r="4" fill="#8fd1d5"/><text x="60.0" y="273" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60.0" dy="0.0">The market today</tspan></text><circle cx="46.0" cy="301" r="4" fill="#8fd1d5"/><text x="60.0" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60.0" dy="0.0">Every verified candidate,</tspan><tspan x="60.0" dy="18.9">ranked: price, house, date,</tspan><tspan x="60.0" dy="18.9">link</tspan></text><circle cx="46.0" cy="372" r="4" fill="#8fd1d5"/><text x="60.0" y="377" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="60.0" dy="0.0">You choose the ten</tspan></text><rect x="342.0" y="64" width="296" height="360" rx="14" fill="#f7f4e2" stroke="#d7d2bb"/><path d="M342.0,78 a14,14 0 0 1 14,-14 h268 a14,14 0 0 1 14,14 v40 h-296 Z" fill="#323748"/><text x="362.0" y="99" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="362.0" dy="0.0">Beginners&#x27; guide</tspan></text><text x="362.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="362.0" dy="0.0">e.g. &quot;A beginners&#x27; guide to coin</tspan><tspan x="362.0" dy="16.9">collecting&quot;</tspan></text><circle cx="368.0" cy="183" r="4" fill="#8fd1d5"/><text x="382.0" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="382.0" dy="0.0">Background: history and why it</tspan><tspan x="382.0" dy="18.9">matters</tspan></text><circle cx="368.0" cy="235" r="4" fill="#8fd1d5"/><text x="382.0" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="382.0" dy="0.0">One section per part of the</tspan><tspan x="382.0" dy="18.9">guide</tspan></text><circle cx="368.0" cy="287" r="4" fill="#8fd1d5"/><text x="382.0" y="292" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="382.0" dy="0.0">Facts from museums, mints and</tspan><tspan x="382.0" dy="18.9">the houses</tspan></text><circle cx="368.0" cy="339" r="4" fill="#8fd1d5"/><text x="382.0" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="382.0" dy="0.0">Advice backed by the source</tspan><tspan x="382.0" dy="18.9">that gives it</tspan></text><circle cx="368.0" cy="391" r="4" fill="#8fd1d5"/><text x="382.0" y="396" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="382.0" dy="0.0">Every fact with its link</tspan></text><rect x="664.0" y="64" width="296" height="360" rx="14" fill="#f7f4e2" stroke="#d7d2bb"/><path d="M664.0,78 a14,14 0 0 1 14,-14 h268 a14,14 0 0 1 14,14 v40 h-296 Z" fill="#323748"/><text x="684.0" y="99" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start"><tspan x="684.0" dy="0.0">Dealer guide</tspan></text><text x="684.0" y="144" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6f7280" text-anchor="start"><tspan x="684.0" dy="0.0">e.g. &quot;Where to buy Oasis memorabilia&quot;</tspan></text><circle cx="690.0" cy="183" r="4" fill="#8fd1d5"/><text x="704.0" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="704.0" dy="0.0">The market</tspan></text><circle cx="690.0" cy="216" r="4" fill="#8fd1d5"/><text x="704.0" y="221" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="704.0" dy="0.0">One section per dealer</tspan></text><circle cx="690.0" cy="249" r="4" fill="#8fd1d5"/><text x="704.0" y="254" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="704.0" dy="0.0">History, location, specialisms</tspan></text><circle cx="690.0" cy="282" r="4" fill="#8fd1d5"/><text x="704.0" y="287" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="704.0" dy="0.0">Two or three real sales each</tspan></text><circle cx="690.0" cy="315" r="4" fill="#8fd1d5"/><text x="704.0" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#231f20" text-anchor="start"><tspan x="704.0" dy="0.0">Website and contact details</tspan></text><text x="490.0" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6f7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Plus, for every article: conflicts between sources, gaps, and rejected candidates with the reason.</tspan></text></svg>